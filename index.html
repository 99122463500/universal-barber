<!DOCTYPE html>
<html>
<head>

<title>Universal Max Factor Barber</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
font-family:Arial;
margin:0;
background:#111;
color:white;
}

header{
background:black;
padding:20px;
text-align:center;
font-size:28px;
}

.hero{
height:70vh;
background:url("https://images.unsplash.com/photo-1503951914875-452162b0f3f1");
background-size:cover;
display:flex;
align-items:center;
justify-content:center;
font-size:40px;
font-weight:bold;
}

section{
padding:50px;
text-align:center;
}

.services{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
}

.service{
background:#222;
padding:20px;
border-radius:10px;
}

.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
}

.gallery img{
width:100%;
border-radius:10px;
}

form{
max-width:400px;
margin:auto;
display:flex;
flex-direction:column;
gap:15px;
}

input,select{
padding:10px;
font-size:16px;
}

button{
padding:12px;
background:#00c853;
color:white;
border:none;
cursor:pointer;
font-size:18px;
}

.whatsapp{
position:fixed;
bottom:20px;
right:20px;
background:#25D366;
color:white;
padding:15px;
border-radius:50px;
text-decoration:none;
font-size:18px;
}

footer{
background:black;
padding:20px;
text-align:center;
}

</style>

</head>

<body>

<header>
Universal Max Factor Barber
</header>

<div class="hero">
Fresh Cuts Everyday
</div>

<section>

<h2>Our Services</h2>

<div class="services">

<div class="service">
<h3>Taper Fade</h3>
<p>Professional taper fade haircut</p>
</div>

<div class="service">
<h3>Skin Fade</h3>
<p>Clean skin fade style</p>
</div>

<div class="service">
<h3>Beard Trim</h3>
<p>Sharp beard shaping</p>
</div>

<div class="service">
<h3>Haircut + Beard</h3>
<p>Full grooming package</p>
</div>

</div>

</section>

<section>

<h2>Our Work</h2>

<div class="gallery">

<img src="https://images.unsplash.com/photo-1622286342621-4bd786c2447c">

<img src="https://images.unsplash.com/photo-1599351431202-1e0f0137899a">

<img src="https://images.unsplash.com/photo-1605497788044-5a32c7078486">

<img src="https://images.unsplash.com/photo-1593702288056-f2d4e3a1d1c4">

<img src="https://images.unsplash.com/photo-1621605815971-fbc98d665033">

<img src="https://images.unsplash.com/photo-1503951914875-452162b0f3f1">

</div>

</section>

<section>

<h2>Book Appointment</h2>

<form>

<input type="text" placeholder="Your Name" required>

<input type="date" required>

<select>

<option>Haircut</option>
<option>Taper Fade</option>
<option>Beard Trim</option>
<option>Haircut + Beard</option>

</select>

<button type="submit">Book Now</button>

</form>

</section>

<section>

<h2>Find Us</h2>

<iframe
width="100%"
height="300"
src="https://maps.google.com/maps?q=johannesburg&t=&z=13&ie=UTF8&iwloc=&output=embed">
</iframe>

</section>

<a class="whatsapp" href="https://wa.me/27700000000">
WhatsApp
</a>

<footer>
Universal Max Factor Barber © 2026
</footer>

</body>
</html>
